name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [validate, lint, fmt:check, typecheck, test, build]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # bb downloads its plugin build toolchain into <dataDir>/plugins on
      # first use; cache it so `bb plugin build` stays fast.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: matrix.task == 'build'
        with:
          path: ~/.bb/plugins/toolchain-*
          key: bb-toolchain-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            bb-toolchain-${{ runner.os }}-
      - run: pnpm run ${{ matrix.task }}

  # Git installs run `npm install --omit=dev` in the plugin directory with no
  # workspace context — prove every plugin survives that exact command.
  npm-install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # This job runs plain npm on purpose; stop setup-node from probing
          # for pnpm because of the root packageManager field.
          package-manager-cache: false
      # npm 10 crashes in Arborist's peer resolver on the current dependency
      # graph, even with --omit=dev. Keep the standalone install check on npm 11.
      - run: npm install --global npm@11.17.0
      - run: |
          set -euo pipefail
          for plugin in plugins/*/; do
            echo "::group::npm install --omit=dev ($plugin)"
            (cd "$plugin" && npm install --omit=dev --no-audit --no-fund)
            echo "::endgroup::"
          done
